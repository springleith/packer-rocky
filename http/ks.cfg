#version=RHEL9
text --non-interactive
skipx
eula --agreed
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# debug networking
network --bootproto=dhcp --device=link --activate --onboot=yes

# Root password, temporary, will be locked in setup-cloud-init.sh
rootpw --plaintext --allow-ssh 123456

# User packer: only use for Packer SSH to build, deleted after building
# only use SSH key
user --name=packer --groups=wheel --plaintext --password=packer

# Disk
clearpart --all --initlabel
autopart --type=lvm
bootloader --location=mbr --timeout=1

# security
firewall --enabled --service=ssh
selinux --enforcing


# Packages
%packages
@^minimal-environment
NetworkManager
openssh-server
sudo
chrony
%end

# Post-install configuration
%post --erroronfail --log=/root/ks-post.log



# Ensure cloud-init is installed and enabled
# install from Appstream, cause minimal ISO not available offer
dnf install -y cloud-init open-vm-tools curl


# Retrieve public key from kernel arguments (handle cases with spaces)
KS_URL=$(grep -o 'inst\.ks=[^ ]*' /proc/cmdline | cut -d'=' -f2- || true)
HTTP_BASE=$(echo "$KS_URL" | sed 's|/ks.cfg$||')


mkdir -p /home/packer/.ssh

if [ -n "$HTTP_BASE" ]; then
    curl -fsS "${HTTP_BASE}/packer_key.pub" \
        -o /home/packer/.ssh/authorized_keys
fi

if [ ! -s /home/packer/.ssh/authorized_keys ]; then
    echo "ERROR: Packer SSH public key was not downloaded"
    exit 1
fi

chown -R packer:packer /home/packer/.ssh
chmod 700 /home/packer/.ssh
chmod 600 /home/packer/.ssh/authorized_keys
restorecon -RFv /home/packer/.ssh



# allow user packer to use sudo without password (only while building)
echo "packer ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/packer
chmod 0440 /etc/sudoers.d/packer


# Enable services

systemctl enable NetworkManager
systemctl enable sshd chronyd
systemctl enable vmtoolsd
systemctl enable cloud-init


%end
# Reboot after the installation is successfully completed
reboot --eject