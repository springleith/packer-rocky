#version=RHEL9
text --non-interactive
skipx
eula --agreed
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Network information
network --device=ens33 --bootproto=dhcp --ipv6=auto --activate

# Initial Setup is not started the first time the system boots
firstboot --disabled

# # Root still needs a password for compliance, but we can set a random locked password
# rootpw --lock

# Define a root password hash so Anaconda is satisfied
rootpw --iscrypted ${root_password_hash}

# Create the packer user and set a hashed password (e.g., password: "yourpassword")
user --name=packer --gecos="Packer"


%post --erroronfail

set -eux

# Create the SSH directory
install -d -m 700 -o packer -g packer /home/packer/.ssh

# Inject the public key rendered by Packer's templatefile()
cat > /home/packer/.ssh/authorized_keys <<'SSHKEY'
${ssh_pub_key}
SSHKEY

# Set ownership and permissions AFTER creating the file
chown packer:packer /home/packer/.ssh/authorized_keys
chmod 600 /home/packer/.ssh/authorized_keys

# Ensure SELinux labels are correct
restorecon -RFv /home/packer/.ssh

# Configure passwordless sudo for the build account
echo "packer ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/packer
chmod 440 /etc/sudoers.d/packer
visudo -cf /etc/sudoers.d/packer

# Verify that the key was actually injected
test -s /home/packer/.ssh/authorized_keys
ssh-keygen -lf /home/packer/.ssh/authorized_keys

%end


# Disk
# Fresh partition layout for this lab VM.
clearpart --all --initlabel
autopart --type=lvm
bootloader --location=mbr --timeout=1

# security baseline
firewall --enabled --service=ssh
selinux --enforcing


# Packages
%packages
@^minimal-environment
sudo
%end

# Reboot after the installation is successfully completed
reboot --eject