#version=RHEL9
text --non-interactive
skipx
eula --agreed
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Network information
network --device=ens33 --bootproto=dhcp --ipv6=auto --activate

# Initial Setup is not started the first time the system boots
firstboot --disabled


# Temporary account for the first working build. 
# Replace password authentication with key authentication later. 
# user --name=packer --groups=wheel --plaintext --password=packer
# Root password
rootpw --plaintext --allow-ssh 123456

# Disk
# Fresh partition layout for this lab VM.
clearpart --all --initlabel
autopart --type=lvm
bootloader --location=mbr --timeout=1

# security baseline
firewall --enabled --service=ssh
selinux --enforcing


# Packages
%packages
@^minimal-environment
%end

# Reboot after the installation is successfully completed
reboot --eject