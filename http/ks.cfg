#version=RHEL9
text --non-interactive
skipx
eula --agreed
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Root password
rootpw --plaintext --allow-ssh 123456

#use password authentication
user --name=packer --password=packer --plaintext --groups=wheel
# sshkey --username=packer "YOUR_SSH_PUBLIC_KEY_HERE" 

# Disk
clearpart --all --initlabel
autopart --type=lvm
bootloader --location=mbr --timeout=1

# security
firewall --enabled
selinux --disabled


# Packages
%packages
@^minimal-environment
open-vm-tools
cloud-init
%end

# Post-install configuration
%post
# Ensure cloud-init is installed and enabled
dnf install -y cloud-init open-vm-tools
# Enable services
systemctl enable sshd chronyd vmtoolsd cloud-init
systemctl start sshd chronyd vmtoolsd
%end
# Reboot after the installation is successfully completed
reboot --eject