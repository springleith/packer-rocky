#version=RHEL9
text --non-interactive
skipx
eula --agreed
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --plaintext changeme
user --name=packer --password=packer --plaintext --groups=wheel
sshkey --username=packer "YOUR_SSH_PUBLIC_KEY_HERE"

autopart
clearpart --all --initlabel
bootloader --location=mbr

# Packages
%packages
@^minimal-environment
open-vm-tools
cloud-init
%end

# Post-install configuration
%post
# Enable services
systemctl enable sshd chronyd vmtoolsd cloud-init
systemctl start sshd chronyd vmtoolsd

# Configure cloud-init for VMware guestinfo datasource
cat > /etc/cloud/cloud.cfg.d/99-vmware-guestinfo.cfg <<'EOF'
datasource_list: [ VMware, OVF, None ]
EOF

# Prevent cloud-init from reverting network config after first boot
echo "manual_cache_clean: True" > /etc/cloud/cloud.cfg.d/99-manual.cache.cfg

# Clean SSH host keys so clones get unique ones
rm -f /etc/ssh/ssh_host_*

# Truncate machine-id for clone uniqueness
truncate -s 0 /etc/machine-id

# Clean logs
find /var/log -type f -exec truncate --size=0 {} \;
rm -f /root/anaconda-ks.cfg /root/original-ks.cfg
%end

reboot --eject