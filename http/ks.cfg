#version=RHEL9
text --non-interactive
skipx
eula --agreed
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Network information
network --device=ens33 --bootproto=dhcp --ipv6=auto --activate

# Initial Setup is not started the first time the system boots
firstboot --disabled

# Define a root password hash so Anaconda is satisfied
rootpw --iscrypted ${root_password_hash}

# Create the packer user and set a hashed password (e.g., password: "yourpassword")
user --name=packer --password=${password_hash} --iscrypted --gecos="Packer"

%post
# Give the packer user passwordless sudo access
echo "packer ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/packer
chmod 0440 /etc/sudoers.d/packer
%end

# Disk
# Fresh partition layout for this lab VM.
clearpart --all --initlabel
autopart --type=lvm
bootloader --location=mbr --timeout=1

# security baseline
firewall --enabled --service=ssh
selinux --enforcing


# Packages
%packages
@^minimal-environment
%end

# Reboot after the installation is successfully completed
reboot --eject