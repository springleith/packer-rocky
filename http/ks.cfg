#version=RHEL9
text --non-interactive
skipx
eula --agreed
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Root password, temporary, will be locked in setup-cloud-init.sh
rootpw --plaintext --allow-ssh 123456

# User packer: only use for Packer SSH to build, deleted after building
# only use SSH key
user --name=packer --groups=wheel --plaintext --password=packer

# Disk
clearpart --all --initlabel
autopart --type=lvm
bootloader --location=mbr --timeout=1

# security
firewall --enabled --service=ssh
selinux --enforcing


# Packages
%packages
@^minimal-environment
%end

# Post-install configuration
%post


# Retrieve public key from kernel arguments (handle cases with spaces)
# Lấy public key từ kernel arguments (đã được base64 encode)
SSH_PUBLIC_KEY_B64=$(grep -o 'inst\.ssh_public_key=[^ ]*' /proc/cmdline | cut -d'=' -f2-)
SSH_PUBLIC_KEY=$(echo "$SSH_PUBLIC_KEY_B64" | base64 -d)

if [ -n "$SSH_PUBLIC_KEY" ]; then
    mkdir -p /home/packer/.ssh
    echo "$SSH_PUBLIC_KEY" > /home/packer/.ssh/authorized_keys
    chown -R packer:packer /home/packer/.ssh
    chmod 700 /home/packer/.ssh
    chmod 600 /home/packer/.ssh/authorized_keys
    # Cực kỳ quan trọng trên Rocky 9 với SELinux enforcing
    restorecon -R /home/packer/.ssh
fi

# Ensure cloud-init is installed and enabled
# install from Appstream, cause minimal ISO not available offer
dnf install -y cloud-init open-vm-tools

# allow user packer to use sudo without password (only while building)
echo "packer ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/packer
chmod 0440 /etc/sudoers.d/packer

# Enable services
systemctl enable --now sshd chronyd
systemctl enable --now vmtoolsd
systemctl enable cloud-init

%end
# Reboot after the installation is successfully completed
reboot --eject