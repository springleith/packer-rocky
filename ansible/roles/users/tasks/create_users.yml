---
- name: Create admin user
  ansible.builtin.user:
    name: sysadmin
    comment: "Lab System Administrator"
    groups:
      - wheel
    append: true
    shell: /bin/bash
    create_home: true
    password_lock: true
    state: present

- name: Configure passwordless sudo for admin user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/sysadmin
    content: "sysadmin ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
