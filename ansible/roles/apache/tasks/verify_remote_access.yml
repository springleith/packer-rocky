---
- name: Verify HTTP access from a separate client
  ansible.builtin.uri:
    url: "http://{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}/"
    method: GET
    status_code: 200
    return_content: true
  delegate_to: "{{ groups['clients'][0] }}"
  become: false
  register: apache_remote_response
  when: groups.get('clients', []) | length > 0

- name: Verify expected content from remote client
  ansible.builtin.assert:
    that:
      - "'Welcome to site1.local on Clone 1' in apache_remote_response.content"
    success_msg: "Remote client can access the expected webpage."
    fail_msg: "Remote HTTP access failed or returned unexpected content."
  when: groups.get('clients', []) | length > 0

