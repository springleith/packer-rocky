---
- name: Test website from client
  ansible.builtin.uri:
    url: "http://192.168.40.143/"
    status_code: 200
    return_content: true
  register: website_response

- name: Verify expected webpage
  ansible.builtin.assert:
    that:
      - "'Welcome to site1.local on Clone 1' in website_response.content"
    success_msg: "Client can access the Apache website."
